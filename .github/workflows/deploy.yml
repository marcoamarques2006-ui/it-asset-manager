name: Deploy

on:
  push:
    branches: [main]

# So dispara depois do merge — codigo que chega aqui ja passou pelos
# checks obrigatorios de ci.yml (branch protection cuida disso), entao
# nao re-testamos, so publicamos.
#
# Dois trilhos independentes:
#   1. Frontend (Vercel) + Supabase — producao real do app (inalterado)
#   2. API em container — versao SemVer -> imagem no GHCR + release ->
#      homologacao -> producao (simulados, com rollback automatico)

# Um deploy por vez: dois merges seguidos nao calculam a mesma versao nem
# disputam a tag do ambiente.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instala dependencias
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Pull das configuracoes do projeto Vercel
        working-directory: frontend
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build de producao
        working-directory: frontend
        run: npx vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        working-directory: frontend
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-supabase:
    name: Deploy Supabase (migrations)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: uldqinjlhfrzunloigxw
    steps:
      - uses: actions/checkout@v4

      # Instala o Supabase CLI na versao fixada no package-lock.json. Sem
      # isso o npx baixava sempre a ultima versao (a 3.0.0 passou a tentar
      # o banco local no db push).
      - name: Instala o Supabase CLI (versao do package-lock)
        run: npm ci

      - name: Link do projeto
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Aplica migrations pendentes
        run: npx supabase db push

  versao:
    name: API - calcula versao (SemVer)
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
      imagem: ${{ steps.v.outputs.imagem }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historico + tags, para achar a ultima versao

      - id: v
        run: |
          versao=$(bash scripts/next-version.sh)
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "imagem=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/it-asset-manager-api" >> "$GITHUB_OUTPUT"
          echo "### Versao: v$versao" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$(git log -1 --format=%s)\`" >> "$GITHUB_STEP_SUMMARY"

  imagem:
    name: API - imagem no GHCR + release
    needs: versao
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + GitHub Release
      packages: write # push no GHCR
    env:
      VERSAO: ${{ needs.versao.outputs.versao }}
      IMAGE: ${{ needs.versao.outputs.imagem }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN efemero do proprio job — nenhuma credencial de
      # registry salva em lugar nenhum.
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags e labels da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSAO }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSAO }}
            type=sha,format=short
            type=raw,value=latest

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.VERSAO }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag git + GitHub Release v${{ env.VERSAO }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSAO" >/dev/null 2>&1; then
            echo "Release v$VERSAO ja existe (re-run) — nada a fazer"
            exit 0
          fi
          gh release create "v$VERSAO" \
            --target "$GITHUB_SHA" \
            --title "v$VERSAO" \
            --generate-notes \
            --notes "Imagem: \`$IMAGE:$VERSAO\`"

      - name: Resumo
        run: |
          {
            echo "### Imagem publicada"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  homologacao:
    name: API - homologacao
    needs: [versao, imagem]
    uses: ./.github/workflows/deploy-ambiente.yml
    permissions:
      contents: read
      packages: write
    with:
      ambiente: homologacao
      versao: ${{ needs.versao.outputs.versao }}
      imagem: ${{ needs.versao.outputs.imagem }}
    # Sem "inherit" o workflow chamado nao enxerga os secrets do environment
    # (POSTGRES_PASSWORD/SECRET_KEY de homologacao/producao).
    secrets: inherit

  producao:
    name: API - producao
    needs: [versao, homologacao]
    uses: ./.github/workflows/deploy-ambiente.yml
    permissions:
      contents: read
      packages: write
    with:
      ambiente: producao
      versao: ${{ needs.versao.outputs.versao }}
      imagem: ${{ needs.versao.outputs.imagem }}
    secrets: inherit
